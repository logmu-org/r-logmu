# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# SPLIT IN TWO ON 2026-08-31 TO STAY INSIDE THE FREE MINUTES. GitHub bills by
# runner: Linux 1x, Windows 2x, macOS 10x. The original single matrix -- macOS,
# Windows and three Linux -- cost about 15 minute-units per minute of wall time,
# and this package compiles a large SIMD library, so the jobs are not short.
# macOS alone was two thirds of the bill.
#
#   check           every push and PR    Windows + Linux release + Linux devel
#   check-extended  weekly, or on demand macOS + Linux oldrel-1
#
# That is 4 minute-units against 15 for the common case, and macOS still runs
# every Monday. TO PUT macOS BACK ON EVERY PUSH, move its entry from the second
# matrix to the first -- both jobs run identical steps, deliberately, so an
# entry can be moved between them without any other change.

on:
  push:
    branches: [main, master]
    # IGNORE, NOT INCLUDE. An allow-list would silently skip a check when
    # something relevant moved into a path nobody remembered to add. This list
    # only holds files that cannot affect `R CMD check`, so anything new runs
    # the check until somebody decides otherwise.
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'cran-comments.md'
      - '.github/workflows/pkgdown.yaml'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'cran-comments.md'
      - '.github/workflows/pkgdown.yaml'
  schedule:
    # Mondays, 06:00 UTC. The platforms that are too expensive to run on push.
    - cron: '0 6 * * 1'
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

# A burst of pushes used to start a full matrix each time. Only the newest is
# worth finishing. Scheduled runs group separately so a push cannot cancel the
# weekly macOS check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: "!contains(github.event.head_commit.message, '[skip checks]') && github.event_name != 'schedule'"
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # SHOW THE WHOLE TEST OUTPUT, NOT THE LAST 13 LINES. That default cut off
      # everything before the point a Windows runner died in the suite, which
      # is the only place the reason would have appeared. 0 means no limit.
      _R_CHECK_TESTS_NLINES_: 0

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          # FAIL ON ERRORS, NOT ON WARNINGS. The action's default is to fail on
          # a WARNING, and this package has one that cannot be fixed: the
          # vendored EVE headers carry pragmas suppressing diagnostics, which
          # `R CMD check` reports and which we are not going to patch out of
          # somebody else's library. With the default, CI could never be green.
          #
          # THE COST IS REAL: a NEW warning will no longer fail the build. The
          # baseline is 1 WARNING (EVE pragmas) + 1 NOTE (AVX flags), so read
          # the check output rather than trusting the tick.
          error-on: '"error"'

      # A BACKTRACE FROM THE WINDOWS CRASH, which is the only thing left that
      # will name the faulting function. The R process dies silently inside
      # `vec_exp` on this runner and nowhere else, so inference has run out.
      #
      # `if: always()` because the check step above has already failed by then.
      # The package is reused from the check's own library rather than rebuilt,
      # which saves a full compile.
      #
      # Rterm.exe is the real binary; R.exe and Rscript.exe are launchers that
      # gdb would not follow into.
      #
      # `printf`, not a heredoc: a heredoc terminator must sit at column 0,
      # which is exactly where a YAML block scalar ends.
      #
      # TEMPORARY -- remove with the rest of the crash diagnostics.
      - name: Backtrace the Windows crash
        if: always() && runner.os == 'Windows'
        shell: bash
        run: |
          set +e
          printf '%s\n' \
            'library(logmu)' \
            'cat("tier:", vec_active_tier(), "lanes:", vec_active_lanes(), "\n")' \
            'flush(stdout())' \
            'x <- ((1:1) * 1.6180339887) %% 1' \
            'for (i in 1:50) {' \
            '  invisible(vec_exp(x))' \
            '  cat("vec_exp ok", i, "\n")' \
            '  flush(stdout())' \
            '}' \
            'cat("PROBE SURVIVED\n")' \
            > crash-probe.R
          echo "----- probe -----"
          cat crash-probe.R

          RBIN=$(Rscript -e 'cat(R.home("bin"))' | tr '\' '/')
          RTERM=""
          for c in "$RBIN/x64/Rterm.exe" "$RBIN/Rterm.exe"; do
            if [ -f "$c" ]; then RTERM="$c"; break; fi
          done
          echo "Rterm: ${RTERM:-NOT FOUND}"

          export R_LIBS="$(pwd)/check/logmu.Rcheck"
          echo "R_LIBS: $R_LIBS"
          ls "$R_LIBS" 2>/dev/null || echo "  (check library missing)"

          echo "===== without gdb, for the exit code ====="
          "$RTERM" --vanilla -f crash-probe.R
          echo "exit code: $?"

          GDB=""
          for c in /c/rtools45/usr/bin/gdb.exe /c/rtools45/x86_64-w64-mingw32.static.posix/bin/gdb.exe; do
            if [ -f "$c" ]; then GDB="$c"; break; fi
          done
          if [ -z "$GDB" ]; then GDB=$(command -v gdb 2>/dev/null); fi
          echo "gdb: ${GDB:-NOT FOUND}"

          if [ -n "$GDB" ]; then
            echo "===== under gdb ====="
            "$GDB" --batch -ex "set pagination off" -ex run -ex "bt full" -ex "info registers rip" --args "$RTERM" --vanilla -f crash-probe.R
            echo "gdb exit: $?"
          fi
          exit 0

  check-extended:
    if: "github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'"
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,  r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # SHOW THE WHOLE TEST OUTPUT, NOT THE LAST 13 LINES. That default cut off
      # everything before the point a Windows runner died in the suite, which
      # is the only place the reason would have appeared. 0 means no limit.
      _R_CHECK_TESTS_NLINES_: 0

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          # FAIL ON ERRORS, NOT ON WARNINGS. The action's default is to fail on
          # a WARNING, and this package has one that cannot be fixed: the
          # vendored EVE headers carry pragmas suppressing diagnostics, which
          # `R CMD check` reports and which we are not going to patch out of
          # somebody else's library. With the default, CI could never be green.
          #
          # THE COST IS REAL: a NEW warning will no longer fail the build. The
          # baseline is 1 WARNING (EVE pragmas) + 1 NOTE (AVX flags), so read
          # the check output rather than trusting the tick.
          error-on: '"error"'
